name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag"
        required: true
        type: choice
        options:
          - latest
          - dev
          - next-dev
  push:
    branches: [ "master", "next-dev" ]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve Docker tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "next-dev" ]; then
            echo "tag=next-dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Dockge base image
        run: |
          docker build . \
            --file docker/Base.Dockerfile \
            --tag cmcooper1980/dockge:base

      - name: Build Dockge healthcheck image
        run: |
          docker build . \
            --file docker/BuildHealthCheck.Dockerfile \
            --tag cmcooper1980/dockge:build-healthcheck

      - name: Build Docker image
        run: |
          docker build . \
            --file docker/Dockerfile \
            --target release \
            --tag ghcr.io/${{ github.repository_owner }}/dockge:${{ steps.vars.outputs.tag }} \
            --tag ghcr.io/${{ github.repository_owner }}/dockge:${{ github.sha }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/dockge:${{ steps.vars.outputs.tag }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/dockge:${{ github.sha }}

      - name: Push Docker image
        run: |
          push_retry() {
            local img="$1"
            local attempt=1
            while [ $attempt -le 4 ]; do
              if docker push "$img"; then
                return 0
              fi
              echo "Push of $img failed (attempt $attempt/4), retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "Push of $img failed after 4 attempts"
            return 1
          }
          push_retry ghcr.io/${{ github.repository_owner }}/dockge:${{ steps.vars.outputs.tag }}
          push_retry ghcr.io/${{ github.repository_owner }}/dockge:${{ github.sha }}
          push_retry ${{ secrets.DOCKERHUB_USERNAME }}/dockge:${{ steps.vars.outputs.tag }}
          push_retry ${{ secrets.DOCKERHUB_USERNAME }}/dockge:${{ github.sha }}

      - name: Trivy vulnerability scan (next-dev tag)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/dockge:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-next-dev
